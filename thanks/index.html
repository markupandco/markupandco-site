<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanks | Markup &amp; Co.</title><meta name="robots" content="noindex"><style>:root{--navy:#1E3A5F;--teal:#2E7D6B;--cream:#F6F3EC;--mint:#9FE3CF;--bg:#F6F3EC;--ink:#1F2933;--muted:#5B6773;--line:#E1E6EC;--card:#ffffff;--accent:#2E7D6B;--accent-ink:#ffffff;--soft:#EAF6F1;--ok:#1f6b4f;--ok-bg:#e6f5ee;--warn:#92400e;--warn-bg:#fffbeb}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.narrow{max-width:980px;margin:0 auto;padding:0 20px}
header.site{position:sticky;top:0;z-index:5;background:rgba(246,243,236,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{font-weight:800;font-size:20px;color:var(--navy);text-decoration:none;letter-spacing:-.3px}
.brand span{color:var(--teal)}
nav.main a{color:var(--muted);text-decoration:none;margin-left:22px;font-size:15px;font-weight:600}
nav.main a:hover{color:var(--navy)}
nav.main a.cta{background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;white-space:nowrap}
nav.main a.cta:hover{color:#fff}
@media (max-width:980px){nav.main a:not(.cta){display:none}}
.hero{padding:36px 0 8px}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-1px;color:var(--navy);margin:0 0 12px}
.hero p.lede{font-size:18px;color:var(--muted);max-width:720px;margin:0}
.stamp{display:inline-block;font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin-top:12px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0 8px}
@media (max-width:760px){.calc{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(30,58,95,.06)}
.card h2{margin:0 0 12px;font-size:18px;color:var(--navy)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
label small{font-weight:400;color:var(--muted)}
.field{position:relative}
.field .pre{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.field .suf{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
input[type=number],select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input.money{padding-left:26px}
input.pct{padding-right:30px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;font-weight:500;margin-top:14px}
.check input{width:18px;height:18px}
.results .big{font-size:34px;font-weight:800;line-height:1.1;margin:4px 0 2px;color:var(--navy)}
.results .sub{color:var(--muted);font-size:14px}
.results table{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}
.results td{padding:7px 0;border-top:1px solid var(--line)}
.results td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.results tr.total td{font-weight:700}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.reverse{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.reverse .out{font-size:22px;font-weight:700}
.promo{background:var(--navy);color:#fff;border:0;border-radius:14px;padding:18px 20px;margin:24px 0;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.promo p{margin:0;flex:1 1 320px}
.promo a{color:#fff}
.promo .btn{background:var(--teal)}
.btn{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:600;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
article{max-width:760px}
article h2{font-size:26px;color:var(--navy);letter-spacing:-.5px;margin:36px 0 10px}
article h3{font-size:18px;color:var(--navy);margin:22px 0 6px}
article p,article li{color:#2e2b26}
table.fees{width:100%;border-collapse:collapse;margin:12px 0 4px;font-size:15px}
table.fees th,table.fees td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.fees th{background:#EEF1F5;font-weight:600;color:var(--navy)}
.example{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;font-size:15px}
.example b{display:block;margin-bottom:4px}
details{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 14px;margin:8px 0}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 2px}
.signup{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:28px 0}
.signup form{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.signup input[type=email]{flex:1 1 220px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.signup button{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.related{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0 30px}
.related a{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink)}
.related a span{display:block;color:var(--muted);font-size:14px;margin-top:4px}
footer.site{border-top:1px solid var(--line);margin-top:40px;padding:24px 0 40px;font-size:14px;color:var(--muted)}
footer.site p{margin:6px 0}
.small{font-size:13px;color:var(--muted)}
</style></head>
<body><header class="site"><div class="wrap"><a class="brand" href="/">Markup <span>&amp;</span> Co.</a><nav class="main"><a class="cta" href="https://www.etsy.com/shop/MarkupandCo" rel="noopener">Shop on Etsy</a></nav></div></header>
<main class="wrap"><section class="hero"><h1>You're on the list.</h1><p class="lede">We'll email you when Whatnot or Depop change their fees, and nothing else.</p>
<p style="margin-top:20px"><a class="btn ghost" href="/whatnot-fee-calculator/">Back to the Whatnot calculator</a> &nbsp; <a class="btn ghost" href="/depop-fee-calculator/">Back to the Depop calculator</a></p></section></main>
<footer class="site"><div class="wrap"><p><a href="https://www.etsy.com/shop/MarkupandCo" rel="noopener">Markup &amp; Co. on Etsy</a> &middot; <a href="/">Templates</a></p></div></footer></body></html>
